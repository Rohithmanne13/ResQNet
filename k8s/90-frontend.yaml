# Web UI: static single-page app + nginx forwarding /api -> request-service, /coord -> coordinator (read-only),
# /prom -> Prometheus (queries). Service names are fully qualified because nginx's resolver does not use the
# cluster search domains. The ports tell the browser where Grafana etc. are reachable (NodePorts).
#   Web UI: NodePort 30088  (WSL2 -> Windows browser: python3 scripts/expose.py, then http://localhost:30088)
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: erms, labels: { app: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: erms/frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_UPSTREAM, value: "request-service.erms.svc.cluster.local:8000" }
            - { name: COORD_UPSTREAM, value: "coordinator.erms.svc.cluster.local:8000" }
            - { name: PROM_UPSTREAM, value: "prometheus.erms.svc.cluster.local:9090" }
            - { name: ERMS_PLATFORM, value: k8s }
            - { name: GRAFANA_PORT, value: "30030" }
            - { name: PROMETHEUS_PORT, value: "30090" }
            - { name: RABBIT_PORT, value: "30672" }
            - { name: API_PORT, value: "30080" }
            - { name: COORD_PORT, value: "30081" }
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 15 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: erms }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30088 }]
