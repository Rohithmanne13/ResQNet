# Monitoring (extension #39): Prometheus + Grafana.
# The configuration files live in monitoring/ and are loaded into ConfigMaps by k8s/deploy.sh:
#   prometheus-config         <- monitoring/prometheus/prometheus-k8s.yml
#   grafana-datasources       <- monitoring/grafana/provisioning/datasources/
#   grafana-dashboard-provider<- monitoring/grafana/provisioning/dashboards/
#   grafana-dashboards        <- monitoring/grafana/dashboards/   (the "ERMS overview" dashboard)
# Grafana's admin password comes from Secret grafana-credentials (random, created by deploy.sh);
# viewing the dashboard needs no login (anonymous read-only access).
#   Prometheus: NodePort 30090      Grafana: NodePort 30030
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: erms }
---
# Prometheus discovers the pods to scrape through the Kubernetes API (read-only, this namespace only)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-discovery, namespace: erms }
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-discovery, namespace: erms }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: erms }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: erms, labels: { app: prometheus } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
                 "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]
          ports: [{ containerPort: 9090 }]
          # generous timeouts: on a busy single-node cluster a 1 s probe timeout (the default) kills a healthy pod
          startupProbe: { httpGet: { path: /-/ready, port: 9090 }, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 }, periodSeconds: 5, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /-/healthy, port: 9090 }, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 6 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }      # metrics history is not needed across Prometheus restarts
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: erms }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090, nodePort: 30090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: erms, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext: { fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:13.2.5
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-credentials, key: admin-password } }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/erms-overview.json }
            - { name: GF_SECURITY_ALLOW_EMBEDDING, value: "true" }    # shown inside the web UI (Monitoring tab)
            # Grafana otherwise downloads ~16 extra plugins (Loki, MSSQL, Tempo, ...; ~480 MB, several running as
            # separate processes) at every start; only the built-in Prometheus data source is used
            - { name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true" }
            # Grafana is a Go program: make its garbage collector keep it near 400 MiB instead of growing until the
            # container limit (where it stalled, failed its health checks and starved the rest of the small cluster)
            - { name: GOMEMLIMIT, value: "400MiB" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
          ports: [{ containerPort: 3000 }]
          # Grafana starts slowly (database migrations) and answers slowly under load: allow up to 5 min to start and
          # 5 s per health check; it is only restarted after 90 s of failed checks (was: killed after 1 s timeouts)
          startupProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 5, timeoutSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 5, timeoutSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 6 }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:          # GOMEMLIMIT 400MiB keeps it well below this limit (measured: ~450 MB with 4 viewers)
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 640Mi }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provider, configMap: { name: grafana-dashboard-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: erms }
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30030 }]
