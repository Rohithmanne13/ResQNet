apiVersion: apps/v1
kind: Deployment
metadata: { name: coordinator, namespace: erms, labels: { app: coordinator } }
spec:
  replicas: 1   # exactly one coordinator (spec); Kubernetes restarts it if it dies
  strategy: { type: Recreate }
  selector: { matchLabels: { app: coordinator } }
  template:
    metadata: { labels: { app: coordinator } }
    spec:
      containers:
        - name: coordinator
          image: erms/coordinator:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: HEARTBEAT_TIMEOUT, value: "6" }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: coordinator, namespace: erms }
spec:
  type: NodePort   # exposed for observability (/cluster) during the demo
  selector: { app: coordinator }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30081 }]
