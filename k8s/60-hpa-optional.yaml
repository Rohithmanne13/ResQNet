# Optional autoscaling (requires metrics-server: `minikube addons enable metrics-server`).
# Manual scaling for the demo: kubectl -n erms scale deployment matching-service --replicas=4
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: matching-service, namespace: erms }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: matching-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
